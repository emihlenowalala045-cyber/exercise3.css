<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Our Products</h1>
    <p>Best deals, best quality</p>
  </header>

  <main class="products">

    <!-- PRODUCT 1 -->
    <article class="card">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&q=80" alt="Headphones">
      <h3>Wireless Headphones</h3>
      <p class="price">R 899.99</p>
    </article>

    <!-- PRODUCT 2 -->
    <article class="card">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=80" alt="Smart Watch">
      <h3>Smart Watch</h3>
      <p class="price">R 1,299.99</p>
    </article>

    <!-- PRODUCT 3 -->
    <article class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&q=80" alt="Sneakers">
      <h3>Running Sneakers</h3>
      <p class="price">R 1,099.99</p>
    </article>

    <!-- PRODUCT 4 -->
    <article class="card">
      <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600&q=80" alt="Backpack">
      <h3>Travel Backpack</h3>
      <p class="price">R 649.99</p>
    </article>

    <!-- PRODUCT 5 -->
    <article class="card">
      <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=600&q=80" alt="Sunglasses">
      <h3>Cool Sunglasses</h3>
      <p class="price">R 349.99</p>
    </article>

    <!-- PRODUCT 6 -->
    <article class="card">
      <img src="https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=600&q=80" alt="Water Bottle">
      <h3>Water Bottle</h3>
      <p class="price">R 199.99</p>
    </article>

  </main>

</body>
</html>
